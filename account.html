<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>我的訂單｜GearLoop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<noscript>
  <div class="empty-state" style="max-width:640px; margin:32px auto">
    <p>此頁面需要啟用 JavaScript 才能顯示訂單與折抵資料，請啟用 JavaScript 後重新整理頁面。</p>
  </div>
</noscript>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="5"/><line x1="17" y1="12" x2="21" y2="12"/></svg></span>
      <span>GearLoop</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首頁</a>
      <a href="gear-list.html">裝備清單</a>
      <a href="account.html" class="active">我的訂單</a>
    </nav>
    <div class="header-actions">
      <a href="checkout.html" class="icon-btn" aria-label="購物車／預約清單">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <a href="account.html" class="icon-btn" aria-label="會員中心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
      <button class="menu-toggle" aria-label="開啟選單" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="section-tight">
    <div class="container">
      <div class="section-head" style="margin-bottom:24px">
        <span class="eyebrow">會員中心</span>
        <h2>我的訂單</h2>
      </div>

      <div id="accountFatalError" style="display:none"></div>

      <div class="account-layout" id="accountLayout">
        <aside class="account-side">
          <div class="account-profile">
            <div class="avatar">林</div>
            <div>
              <div class="name">林小山</div>
              <div class="email">demo@gearloop.example</div>
            </div>
          </div>
          <nav class="side-nav">
            <a href="#orders" data-view="orders" class="active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/></svg>
              我的訂單
            </a>
            <a href="#sizes" data-view="sizes">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5"/><line x1="7" y1="8" x2="7" y2="11"/><line x1="11" y1="8" x2="11" y2="11"/><line x1="15" y1="8" x2="15" y2="11"/></svg>
              我的尺寸紀錄
            </a>
            <button type="button" class="side-nav-item" data-coming-soon>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11a7 7 0 0 0-14 0c0 4.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
              常用取貨地點
              <span class="coming-soon-tag">即將推出</span>
            </button>
            <button type="button" class="side-nav-item" data-coming-soon>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
              帳戶設定
              <span class="coming-soon-tag">即將推出</span>
            </button>
          </nav>

          <div class="demo-data-controls">
            <p class="field-hint">示範資料管理</p>
            <button type="button" class="btn btn-ghost btn-sm btn-block" id="toggleDemoBtn">隱藏示範資料</button>
            <button type="button" class="btn btn-ghost btn-sm btn-block" id="clearUserDataBtn">清除我的操作資料</button>
            <button type="button" class="btn btn-ghost btn-sm btn-block" id="resetPrototypeBtn">重設作品原型</button>
          </div>
        </aside>

        <div class="account-main">
        <div id="view-orders">

          <div class="order-card" id="creditsSummaryPanel"></div>

          <div id="ordersList"></div>

          <div class="empty-state" id="ordersEmptyState" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/></svg>
            <p>目前還沒有訂單</p>
            <p class="field-hint">完成第一次裝備租借或購買後，訂單會顯示在這裡。</p>
            <a href="gear-list.html" class="btn btn-forest" style="margin-top:16px">瀏覽裝備</a>
          </div>

        </div>

        <div id="view-sizes" style="display:none">
          <div class="order-card">
            <h2 style="font-size:1.1rem">我的尺寸紀錄</h2>
            <p class="panel-desc">儲存身形與鞋碼資料，之後到登山鞋商品頁會自動幫你算出建議試穿尺寸，仍需你自己確認後選擇。</p>

            <div class="size-tool-grid" style="margin-top:20px">
              <div class="field">
                <label for="profileHeight">身高（cm）</label>
                <input type="number" class="input" id="profileHeight" min="120" max="210" placeholder="例如 173">
              </div>
              <div class="field">
                <label for="profileWeight">體重（kg）</label>
                <input type="number" class="input" id="profileWeight" min="30" max="150" placeholder="例如 80">
              </div>
              <div class="field">
                <label for="profileShoeSize">平常鞋碼（EU）</label>
                <input type="number" class="input" id="profileShoeSize" min="36" max="45" step="0.5" placeholder="例如 40">
              </div>
              <div class="field">
                <label for="profileFootWidth">腳型</label>
                <select class="input" id="profileFootWidth">
                  <option value="narrow">窄</option>
                  <option value="regular" selected>一般</option>
                  <option value="wide">寬</option>
                </select>
              </div>
              <div class="field">
                <label for="profileFit">偏好合腳程度</label>
                <select class="input" id="profileFit">
                  <option value="snug">合身</option>
                  <option value="regular" selected>一般</option>
                  <option value="loose">寬鬆</option>
                </select>
              </div>
            </div>

            <div class="cta-row" style="margin-top:16px">
              <button class="btn btn-primary" type="button" id="saveProfileBtn">儲存尺寸紀錄</button>
              <button class="btn btn-ghost" type="button" id="resetProfileBtn">重新計算</button>
            </div>
            <p class="field-hint" id="profileSavedNote" aria-live="polite" style="margin-top:10px"></p>
          </div>
        </div>

      </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 GearLoop</span>
      <span>本網站為作品集概念原型，商品與訂單資料皆為示範用途，非真實電商服務</span>
    </div>
  </div>
</footer>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/credits.js"></script>
<script src="js/account.js"></script>
</body>
</html>
