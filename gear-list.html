<script>
  function gearCardHTML(item) {
    const activity = getActivityById(item.activity);
    const status = stockStatus(item.stock);
    return `
      <a href="product.html?id=${item.id}" class="gear-card">
        <div class="gear-thumb${item.photo ? ' has-photo' : ''}" data-activity="${item.activity}">
          ${item.photo ? `<img src="${item.photo}" alt="${item.name}" loading="lazy">` : svgIcon(item.icon)}
          <span class="stock-badge ${status.key}">${status.label}</span>
          <span class="difficulty-badge">${item.difficulty}</span>
        </div>
        <div class="gear-body">
          <span class="gear-activity-tag">${activity.name}</span>
          <h3>${item.name}</h3>
          <p class="gear-desc">${item.desc}</p>
          <div class="price-compare">
            <div class="price-block rent">
              <div class="pb-label">租借</div>
              <div class="pb-value">${formatCurrency(item.rentPricePerDay)}<span class="pb-unit">/天</span></div>
            </div>
            <div class="price-block buy">
              <div class="pb-label">購買</div>
              <div class="pb-value">${formatCurrency(item.buyPrice)}</div>
            </div>
          </div>
        </div>
      </a>
    `;
  }

  const params = new URLSearchParams(location.search);
  let currentActivity = params.get('activity') || 'all';
  if (!ACTIVITIES.some((a) => a.id === currentActivity)) currentActivity = 'all';
  let currentSort = 'default';

  const tabs = document.querySelectorAll('#activityTabs .tab-btn');
  const grid = document.getElementById('gearGrid');
  const emptyState = document.getElementById('emptyState');
  const resultCount = document.getElementById('resultCount');
  const sortSelect = document.getElementById('sortSelect');

  function render() {
    tabs.forEach((t) => t.classList.toggle('active', t.dataset.activity === currentActivity));

    let items = currentActivity === 'all'
      ? GEAR_ITEMS.slice()
      : GEAR_ITEMS.filter((g) => g.activity === currentActivity);

    if (currentSort === 'rent-asc') items.sort((a, b) => a.rentPricePerDay - b.rentPricePerDay);
    if (currentSort === 'rent-desc') items.sort((a, b) => b.rentPricePerDay - a.rentPricePerDay);
    if (currentSort === 'stock-desc') items.sort((a, b) => b.stock - a.stock);

    resultCount.textContent = `共 ${items.length} 項裝備`;
    grid.style.display = items.length ? 'grid' : 'none';
    emptyState.style.display = items.length ? 'none' : 'block';
    grid.innerHTML = items.map(gearCardHTML).join('');
  }

  tabs.forEach((t) => {
    t.addEventListener('click', () => {
      currentActivity = t.dataset.activity;
      const url = new URL(location.href);
      if (currentActivity === 'all') url.searchParams.delete('activity');
      else url.searchParams.set('activity', currentActivity);
      history.replaceState(null, '', url);
      render();
    });
  });

  sortSelect.addEventListener('change', () => {
    currentSort = sortSelect.value;
    render();
  });

  render();
</script>
