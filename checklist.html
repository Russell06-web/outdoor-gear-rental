<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>建立我的裝備清單｜GearLoop</title>
<meta name="description" content="依活動類型與行程條件，自動產生必備、建議與依需求裝備清單，勾選已有裝備即時算出準備完成度。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<noscript>
  <div class="empty-state" style="max-width:640px; margin:32px auto">
    <p>此頁面需要啟用 JavaScript 才能建立與計算裝備清單，請啟用 JavaScript 後重新整理頁面。</p>
  </div>
</noscript>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="5"/><line x1="17" y1="12" x2="21" y2="12"/></svg></span>
      <span>GearLoop</span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首頁</a>
      <a href="gear-list.html">裝備清單</a>
      <a href="account.html">我的訂單</a>
    </nav>
    <div class="header-actions">
      <a href="checkout.html" class="icon-btn" aria-label="購物車／預約清單">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <a href="account.html" class="icon-btn" aria-label="會員中心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
      <button class="menu-toggle" aria-label="開啟選單" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="section-tight">
    <div class="container">
      <div class="section-head" style="margin-bottom:32px">
        <span class="eyebrow">智慧裝備清單</span>
        <h2>建立我的裝備清單</h2>
        <p>不知道要準備什麼裝備？選活動、答幾個簡單問題，馬上幫你整理必備與建議清單。</p>
      </div>

      <div id="checklistFatalError" style="display:none"></div>

      <div id="checklistWizard">
      <ol class="wizard-steps" aria-label="建立裝備清單步驟">
        <li class="wizard-step active" data-step="1" aria-current="step"><span class="ws-num">1</span> 選擇活動</li>
        <li class="wizard-step" data-step="2"><span class="ws-num">2</span> 活動條件</li>
        <li class="wizard-step" data-step="3"><span class="ws-num">3</span> 你的清單</li>
      </ol>

      <!-- Step 1 -->
      <div class="wizard-panel" id="step1">
        <h2 class="visually-hidden" id="step1Title" tabindex="-1">選擇活動</h2>
        <div class="checklist-activity-grid" id="activityChoices"></div>
      </div>

      <!-- Step 2 -->
      <div class="wizard-panel" id="step2" style="display:none">
        <div class="panel" style="max-width:640px">
          <h2 id="step2Title" tabindex="-1"></h2>
          <p class="panel-desc" id="step2Desc"></p>
          <div id="step2Questions" style="margin-top:20px"></div>
          <div class="cta-row" style="margin-top:8px">
            <button class="btn btn-ghost" type="button" id="backToStep1">上一步</button>
            <button class="btn btn-primary" type="button" id="generateListBtn">產生清單</button>
          </div>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="wizard-panel" id="step3" style="display:none">
        <div class="panel completion-panel">
          <div class="completion-row">
            <div>
              <h2 id="resultTitle" tabindex="-1"></h2>
              <p class="panel-desc">勾選「我已經有」的裝備，完成度會即時更新。</p>
            </div>
            <div class="completion-badge" aria-live="polite">
              <div class="completion-pct" id="completionPct">0%</div>
              <div class="completion-label" id="completionLabel">裝備準備完成度</div>
            </div>
          </div>
          <div class="completion-bar" id="completionBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="completionLabel"><div class="completion-bar-fill" id="completionBarFill" style="width:0%"></div></div>
          <div class="completion-breakdown" aria-live="polite">
            <span id="mustCompletionText">必備裝備完成度：0／0</span>
            <span id="suggestedCompletionText">建議攜帶：0／0</span>
            <span id="optionalCompletionText">個人選配：0／0</span>
          </div>
          <p class="field-hint" style="margin-top:8px">完成度僅以必備裝備計算，建議與選配可依行程自行調整。</p>
        </div>

        <div id="resultGroups" aria-live="polite"></div>

        <div class="cta-row" style="margin-top:8px; flex-wrap:wrap">
          <button class="btn btn-primary" type="button" id="addMissingBtn">將缺少裝備加入預約清單</button>
          <button class="btn btn-outline" type="button" id="restartBtn">重新開始</button>
          <a href="gear-list.html" class="btn btn-ghost">瀏覽全部裝備</a>
        </div>
      </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 GearLoop</span>
      <span>本網站為作品集概念原型，商品與訂單資料皆為示範用途，非真實電商服務</span>
    </div>
  </div>
</footer>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/credits.js"></script>
<script>
try {
  const CHECKLIST_ICONS = {
    'day-hike': 'mountain',
    'multi-day-hike': 'backpack',
    'camping': 'tent',
    'sup': 'paddleboard',
    'snorkeling': 'snorkel',
  };

  let step = 1;
  let activeActivity = null;
  let answers = {};
  let ownedIds = new Set();

  const step1El = document.getElementById('step1');
  const step2El = document.getElementById('step2');
  const step3El = document.getElementById('step3');
  const stepIndicators = document.querySelectorAll('.wizard-step');

  const STEP_HEADING_IDS = { 1: 'step1Title', 2: 'step2Title', 3: 'resultTitle' };

  function goToStep(n) {
    step = n;
    step1El.style.display = n === 1 ? 'block' : 'none';
    step2El.style.display = n === 2 ? 'block' : 'none';
    step3El.style.display = n === 3 ? 'block' : 'none';
    stepIndicators.forEach((el) => {
      const s = parseInt(el.dataset.step, 10);
      el.classList.toggle('active', s === n);
      el.classList.toggle('done', s < n);
      if (s === n) {
        el.setAttribute('aria-current', 'step');
      } else {
        el.removeAttribute('aria-current');
      }
    });
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    const heading = document.getElementById(STEP_HEADING_IDS[n]);
    if (heading) heading.focus();
  }

  function renderActivityChoices() {
    const wrap = document.getElementById('activityChoices');
    wrap.innerHTML = CHECKLIST_ACTIVITIES.map((a) => `
      <button type="button" class="checklist-activity-card" data-id="${a.id}">
        <div class="ac-icon">${svgIcon(CHECKLIST_ICONS[a.id] || 'package')}</div>
        <h3>${a.name}</h3>
        <p>${a.desc}</p>
      </button>
    `).join('');
    wrap.querySelectorAll('.checklist-activity-card').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeActivity = getChecklistActivity(btn.dataset.id);
        answers = {};
        renderStep2();
        goToStep(2);
      });
    });
  }

  function renderStep2() {
    document.getElementById('step2Title').textContent = activeActivity.name;
    document.getElementById('step2Desc').textContent = activeActivity.desc;
    const wrap = document.getElementById('step2Questions');
    wrap.innerHTML = activeActivity.questions.map((q) => {
      if (q.type === 'select') {
        return `
          <div class="form-row">
            <label for="q-${q.id}">${q.label}</label>
            <select class="input" id="q-${q.id}" data-qid="${q.id}">
              ${q.options.map((o) => `<option value="${o.value}">${o.label}</option>`).join('')}
            </select>
          </div>`;
      }
      return `
        <div class="form-row">
          <label for="q-${q.id}">${q.label}</label>
          <input type="number" class="input" id="q-${q.id}" data-qid="${q.id}" min="${q.min}" max="${q.max}" placeholder="${q.placeholder || ''}">
        </div>`;
    }).join('');
    if (activeActivity.questions.length === 0) {
      wrap.innerHTML = `<p class="field-hint">這個活動不需要額外設定，直接產生清單即可。</p>`;
    }
  }

  document.getElementById('backToStep1').addEventListener('click', () => goToStep(1));

  document.getElementById('generateListBtn').addEventListener('click', () => {
    answers = {};
    activeActivity.questions.forEach((q) => {
      const el = document.getElementById(`q-${q.id}`);
      answers[q.id] = q.type === 'number' ? parseFloat(el.value) || null : el.value;
    });
    ownedIds = new Set();
    renderStep3();
    goToStep(3);
    setChecklistState({ activityId: activeActivity.id, activityName: activeActivity.name, answers, generatedAt: new Date().toISOString() });
  });

  function groupHTML(title, ids, groupKey) {
    if (!ids.length) return '';
    const rows = ids.map((id) => {
      const item = getGearById(id);
      if (!item) return '';
      const checked = ownedIds.has(id) ? 'checked' : '';
      return `
        <label class="checklist-row">
          <input type="checkbox" data-gear-id="${id}" ${checked}>
          <div class="cr-thumb gear-thumb${item.photo ? ' has-photo' : ''}" data-activity="${item.activity}">
            ${item.photo ? `<img src="${item.photo}" alt="${item.name}">` : svgIcon(item.icon)}
          </div>
          <div class="cr-body">
            <div class="cr-title">${item.name}</div>
            <div class="cr-meta">租借 ${formatCurrency(item.rentPricePerDay)}/天 ・ 購買 ${formatCurrency(item.buyPrice)}</div>
          </div>
          <a href="product.html?id=${item.id}" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()">查看商品</a>
        </label>`;
    }).join('');
    return `
      <div class="checklist-group">
        <h3 class="checklist-group-title">${title}</h3>
        <div class="checklist-group-body">${rows}</div>
      </div>`;
  }

  function allListedIds() {
    return [...activeActivity.must, ...activeActivity.suggested, ...activeActivity.optional];
  }

  /* Must/suggested/optional are tracked as three separate tallies — the
     headline progress bar only ever reflects must-have gear, so finishing
     the essentials always reads as "done" regardless of how many optional
     or suggested items are still unchecked. */
  function tally(ids) {
    return { owned: ids.filter((id) => ownedIds.has(id)).length, total: ids.length };
  }

  function updateCompletion() {
    const must = tally(activeActivity.must);
    const suggested = tally(activeActivity.suggested);
    const optional = tally(activeActivity.optional);
    const mustPct = must.total ? Math.round((must.owned / must.total) * 100) : 100;

    document.getElementById('completionPct').textContent = `${mustPct}%`;
    document.getElementById('completionBarFill').style.width = `${mustPct}%`;
    document.getElementById('completionBar').setAttribute('aria-valuenow', String(mustPct));
    document.getElementById('completionLabel').textContent = mustPct >= 100 ? '必備裝備已準備完成' : '裝備準備完成度';
    document.getElementById('mustCompletionText').textContent = `必備裝備完成度：${must.owned}／${must.total}`;
    document.getElementById('suggestedCompletionText').textContent = `建議攜帶：${suggested.owned}／${suggested.total}`;
    document.getElementById('optionalCompletionText').textContent = `個人選配：${optional.owned}／${optional.total}`;
  }

  function renderStep3() {
    document.getElementById('resultTitle').textContent = `${activeActivity.name}的裝備清單`;
    const groups = document.getElementById('resultGroups');
    groups.innerHTML = [
      groupHTML('必備裝備', activeActivity.must, 'must'),
      groupHTML('建議攜帶', activeActivity.suggested, 'suggested'),
      groupHTML('依個人需求', activeActivity.optional, 'optional'),
    ].join('');

    groups.querySelectorAll('input[type="checkbox"][data-gear-id]').forEach((cb) => {
      cb.closest('.checklist-row').classList.toggle('owned', cb.checked);
      cb.addEventListener('change', () => {
        if (cb.checked) ownedIds.add(cb.dataset.gearId);
        else ownedIds.delete(cb.dataset.gearId);
        cb.closest('.checklist-row').classList.toggle('owned', cb.checked);
        updateCompletion();
      });
    });
    updateCompletion();
  }

  document.getElementById('addMissingBtn').addEventListener('click', () => {
    const missing = allListedIds().filter((id) => !ownedIds.has(id));
    if (missing.length === 0) {
      showToast('裝備都已經有囉，沒有缺少的項目');
      return;
    }

    const sizedItems = [];
    const addableItems = [];
    missing.forEach((id) => {
      const item = getGearById(id);
      if (!item) return;
      if (getSizeStockForMode(item, 'rent')) sizedItems.push(item);
      else addableItems.push(item);
    });

    // Default dates: reuse the cart's existing rental range if one already exists (so this
    // can never create a same-cart date conflict); otherwise a plain +3/+6 default — but
    // always shown and editable, never decided silently in the background.
    const existingRange = getCartRentalDateRange();
    const defaultStart = existingRange ? existingRange.startDate : todayStr(3);
    const defaultEnd = existingRange ? existingRange.endDate : todayStr(6);

    const overlay = showModal(`
      <h2 id="addMissingTitle" style="font-size:1.15rem">確認加入預約清單</h2>
      <div class="review-box" style="margin-top:4px">
        <div class="review-row"><span>活動</span><span>${activeActivity.name}</span></div>
        ${answers.people ? `<div class="review-row"><span>人數</span><span>${answers.people} 人</span></div>` : ''}
      </div>
      <div class="kit-modal-field-row">
        <div class="kit-modal-field">
          <label for="missingStartDate">取貨日</label>
          <input type="date" class="input" id="missingStartDate" value="${defaultStart}" min="${todayStr()}">
        </div>
        <div class="kit-modal-field">
          <label for="missingEndDate">歸還日</label>
          <input type="date" class="input" id="missingEndDate" value="${defaultEnd}">
        </div>
      </div>
      <div class="kit-modal-field">
        <p class="field-hint" style="margin-bottom:6px">將加入預約清單（${addableItems.length} 項）</p>
        <ul class="rental-contents-list">${addableItems.map((i) => `<li>${svgIcon('checkCircle', 'style="width:14px;height:14px"')} ${i.name}</li>`).join('') || `<li class="field-hint">（無，全部需要先選尺寸）</li>`}</ul>
      </div>
      ${sizedItems.length ? `
        <div class="kit-modal-field">
          <p class="field-hint" style="margin-bottom:6px; color:var(--color-warning)">需要先選擇尺寸，不會自動加入</p>
          <ul class="rental-contents-list">
            ${sizedItems.map((i) => `<li>${svgIcon('alertTriangle', 'style="width:14px;height:14px"')} ${i.name}<a href="product.html?id=${i.id}" class="btn btn-ghost btn-sm" style="margin-left:10px">前往商品頁</a></li>`).join('')}
          </ul>
        </div>
      ` : ''}
      <p class="form-error" id="missingModalError" role="alert" style="display:none"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary btn-block" id="confirmAddMissing" ${addableItems.length === 0 ? 'disabled' : ''}>確認加入</button>
        <button type="button" class="btn btn-ghost btn-block" id="cancelAddMissing">取消</button>
      </div>
    `, { labelledBy: 'addMissingTitle' });

    const startInput = overlay.querySelector('#missingStartDate');
    const endInput = overlay.querySelector('#missingEndDate');
    const errorEl = overlay.querySelector('#missingModalError');
    function showMissingError(msg) { errorEl.textContent = msg; errorEl.style.display = 'block'; }

    [startInput, endInput].forEach((el) => el.addEventListener('change', () => {
      if (endInput.value && startInput.value && endInput.value <= startInput.value) {
        const d = new Date(`${startInput.value}T00:00:00`);
        d.setDate(d.getDate() + 1);
        endInput.value = localDateString(d);
      }
      errorEl.style.display = 'none';
    }));

    const confirmBtn = overlay.querySelector('#confirmAddMissing');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', () => {
        const start = startInput.value;
        const end = endInput.value;
        const days = daysBetween(start, end);
        if (days <= 0) { showMissingError('請選擇有效的取貨與歸還日期。'); return; }
        if (!isSameRentalDateRange(start, end)) {
          showMissingError('所選日期與購物車目前的租借日期不同，請調整日期或先確認購物車。');
          return;
        }
        const shortage = addableItems.find((item) => getAvailableRentalStock({ gearId: item.id, startDate: start, endDate: end }) < 1);
        if (shortage) {
          showMissingError(`${shortage.name} 所選日期目前無庫存，請調整日期或至商品頁查看其他選項。`);
          return;
        }

        let allOk = true;
        addableItems.forEach((item) => {
          const ok = addToCart({
            gearId: item.id, name: item.name, icon: item.icon, photo: item.photo || null, activity: item.activity,
            mode: 'rent', selectedSize: null, recommendedSize: null, quantity: 1,
            startDate: start, endDate: end, days,
            unitPrice: item.rentPricePerDay, lineTotal: days * item.rentPricePerDay,
          });
          if (!ok) allOk = false;
        });
        closeModal();
        if (!allOk) {
          showToast('資料暫時無法儲存，請確認瀏覽器沒有停用網站儲存功能。');
          return;
        }
        showToast(sizedItems.length > 0
          ? `已加入 ${addableItems.length} 項裝備，另有 ${sizedItems.length} 項需要先選擇尺寸。`
          : `已加入 ${addableItems.length} 項裝備。`);
      });
    }
    overlay.querySelector('#cancelAddMissing').addEventListener('click', () => closeModal());
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    activeActivity = null;
    answers = {};
    ownedIds = new Set();
    goToStep(1);
  });

  renderActivityChoices();
} catch (err) {
  console.error(err);
  document.getElementById('checklistWizard').style.display = 'none';
  renderFatalErrorState(document.getElementById('checklistFatalError'), { message: '裝備清單工具目前無法載入，請重新整理頁面。' });
}
</script>
</body>
</html>
